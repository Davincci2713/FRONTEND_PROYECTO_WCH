<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tu plataforma para el Mundial de Futbol — estadisticas, album de stickers, tickets, apuestas y comunidad.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="World Cup Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph / link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="World Cup Hub">
  <meta property="og:description" content="Tu plataforma para el Mundial de Futbol — estadisticas, album de stickers, tickets, apuestas y comunidad.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="World Cup Hub">
  <meta name="twitter:description" content="Tu plataforma para el Mundial de Futbol — estadisticas, album de stickers, tickets, apuestas y comunidad.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>World Cup Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Forzar que el service worker compruebe actualizaciones en cada carga
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.update();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
